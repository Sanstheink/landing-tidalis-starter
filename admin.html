<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TIDALIS Admin</title><link rel="stylesheet" href="/admin.css"></head><body><header><a href="/">TIDALIS <small>ADMIN STUDIO</small></a><a href="/" target="_blank" rel="noopener">ดูเว็บไซต์</a><button id="logout" hidden>ออกจากระบบ</button></header><main><section id="login"><div class="eyebrow">CONTENT MANAGEMENT</div><h1>จัดการทุกเรื่องราว<br>ของ TIDALIS</h1><p>เข้าสู่ระบบด้วยบัญชีผู้ดูแลที่ได้รับสิทธิ์</p><form id="login-form"><label>อีเมล<input name="email" type="email" autocomplete="username" required></label><label>รหัสผ่าน<input name="password" type="password" autocomplete="current-password" required></label><button>เข้าสู่ระบบ</button></form></section><div role="status" id="status" aria-live="polite"></div><section id="app" hidden><nav id="tabs"><button data-kind="page">เนื้อหาหน้าเว็บ</button><button data-kind="service">บริการ</button><button data-kind="talent">ศิลปิน</button><button data-kind="work">ผลงาน</button><button data-kind="news">ข่าวสาร</button><button data-kind="messages">ข้อความติดต่อ</button></nav><div class="toolbar"><h1 id="section-name">เนื้อหาหน้าเว็บ</h1><button id="new">เพิ่มรายการ</button><button id="refresh">รีเฟรช</button></div><p id="hint">บันทึกเป็นร่างเพื่อตรวจเนื้อหาก่อนเผยแพร่</p><div class="layout"><div id="list"></div><form id="editor" hidden><h2 id="editor-heading">แก้ไขรายการ</h2><input type="hidden" name="id"><label>รหัสรายการ (slug)<input name="slug" required pattern="[a-zA-Z0-9_-]+" maxlength="150"><small id="slug-hint">ใช้ภาษาอังกฤษ ตัวเลข - หรือ _</small></label><div class="columns"><label>ชื่อ / หัวข้อภาษาไทย<input name="title_th" maxlength="300"></label><label>ชื่อ / หัวข้อภาษาอังกฤษ<input name="title_en" maxlength="300"></label></div><div class="columns"><label>เนื้อหาภาษาไทย<textarea name="body_th" maxlength="20000"></textarea></label><label>เนื้อหาภาษาอังกฤษ<textarea name="body_en" maxlength="20000"></textarea></label></div><label>ภาพประกอบ<input type="file" id="upload" accept="image/jpeg,image/png,image/webp"><small>JPG, PNG, WebP ไม่เกิน 5 MB ภาพที่อัปโหลดจะเป็นสาธารณะ</small></label><label>URL ภาพ<input name="image_url" type="url" pattern="https://.*"></label><label>ลิงก์ภายนอก<input name="link_url" type="url" pattern="https://.*"></label><label>ลำดับแสดงผล<input name="sort_order" type="number" value="0" step="1" required></label><label class="check"><input name="published" type="checkbox">เผยแพร่บนเว็บไซต์</label><div class="toolbar"><button type="submit">บันทึก</button><button type="button" id="cancel">ปิด</button></div></form></div></section></main><script type="module" src="/admin.js"></script></body></html>
